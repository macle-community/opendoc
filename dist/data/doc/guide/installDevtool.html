<h3 id="常见问题">常见问题</h3>
<h4 id="安装插件过程中出现报错：-激活拓展--macleteammacle-miniprogram-tools--失败：unexpected-token---如何处理？">安装插件过程中出现报错： “激活拓展 &#39; MacleTeam.macle-miniprogram-tools &#39; 失败：Unexpected token {”  如何处理？</h4>
<p><strong>A:</strong> 出现此类报错，大多是由于安装了过旧版本的vscode，请尝试更新您的vscode，具体安装流程请参考 <a onclick="_mdLinkClick(this.href)" href="#/guide/installDevtool">安装开发者工具</a></p>
