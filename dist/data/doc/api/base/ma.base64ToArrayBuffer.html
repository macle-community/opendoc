<h1 id="arraybuffer-mabase64toarraybufferstring-base64">ArrayBuffer ma.base64ToArrayBuffer(string base64)</h1>
<blockquote>
<p>将 Base64 字符串转成 ArrayBuffer 对象（最低版本：24.12.0）</p>
</blockquote>
<h3 id="参数">参数</h3>
<p><strong>string base64</strong></p>
<p>要转化成 ArrayBuffer 对象的 Base64 字符串</p>
<h3 id="返回值">返回值</h3>
<p><strong>ArrayBuffer</strong></p>
<p>ArrayBuffer 对象</p>
<h3 id="示例代码">示例代码</h3>
<pre><code class="language-js"><span class="hljs-keyword">const</span> base64 = <span class="hljs-string">&#x27;CxYh&#x27;</span>;
<span class="hljs-keyword">const</span> arrayBuffer = ma.base64ToArrayBuffer(base64);
</code></pre>
