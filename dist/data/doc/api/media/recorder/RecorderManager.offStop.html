<h2 id="recordermanageroffstopfunction-listener">RecorderManager.offStop(function listener)</h2>
<blockquote>
<p>移除录音结束事件监听函数（最低版本：23.9.0）</p>
</blockquote>
<h3 id="参数">参数</h3>
<h4 id="function-listener">function listener</h4>
<p>指定要移除的监听函数，若不指定则移除已注册的所有监听函数</p>
<h3 id="示例代码">示例代码</h3>
<pre><code class="language-javascript"><span class="hljs-function"><span class="hljs-title">Page</span>({
    <span class="hljs-title">clearListener</span>() {
        <span class="hljs-variable">recorderManager.offStop</span>();
    }
})</span>
</code></pre>
