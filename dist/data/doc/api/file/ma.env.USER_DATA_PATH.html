<h2 id="maenvuser_data_path">ma.env.USER_DATA_PATH</h2>
<blockquote>
<p>一个常量字符串，表示用户可操作的目录路径。（最低版本：23.6.0）</p>
</blockquote>
<p>ma.env.USER_DATA_PATH表示的路径并不是文件的在系统中保存的真实路径，而是SDK提供的<strong>虚拟路径</strong>，该路径在不同系统中转换成真实路径也是不同的。在模拟器中该虚拟路径常量应为 &#39;h t t p ://usr&#39;，在安卓和iOS端侧返回的常量值应为 <strong>mafile://usr</strong>。限制用户的文件操作只允许在该路径下操作。</p>
<h3 id="示例代码">示例代码</h3>
<pre><code class="language-js"><span class="hljs-keyword">Function</span> <span class="hljs-title function_">showDataPath</span>(<span class="hljs-params"></span>) {
  <span class="hljs-built_in">console</span>.<span class="hljs-built_in">log</span>(ma.env.USER_DATA_PATH);
}
</code></pre>
