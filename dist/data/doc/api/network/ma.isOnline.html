<h2 id="maisonline">ma.isOnline()</h2>
<blockquote>
<p>判断当前的联网状态（最低版本：23.12.0）</p>
</blockquote>
<h3 id="返回值">返回值</h3>
<p>返回布尔类型，若为true则表示当前为联网状态，为false则表示当前网络为离线状态</p>
<h3 id="示例代码">示例代码</h3>
<pre><code class="language-js">    const isOnline = ma.isOnline()
    <span class="hljs-built_in">console</span>.<span class="hljs-built_in">log</span>(isOnline ? <span class="hljs-string">&#x27;online&#x27;</span> :<span class="hljs-string">&#x27;offline&#x27;</span>)
</code></pre>
