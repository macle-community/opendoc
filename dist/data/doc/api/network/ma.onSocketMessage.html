<h2 id="maonsocketmessagefunction-callback">ma.onSocketMessage(function callback)</h2>
<blockquote>
<p>监听 WebSocket 接受到服务器的消息事件。</p>
</blockquote>
<h3 id="参数">参数</h3>
<h4 id="function-callback">function callback</h4>
<p>WebSocket 接受到服务器的消息事件的回调函数</p>
<h4 id="参数-1">参数</h4>
<h5 id="object-res">Object res</h5>
<table>
<thead>
<tr>
<th align="left">属性</th>
<th align="left">类型</th>
<th align="left">说明</th>
</tr>
</thead>
<tbody><tr>
<td align="left">data</td>
<td align="left">String</td>
<td align="left">服务器返回的消息</td>
</tr>
</tbody></table>
<h3 id="示例代码">示例代码</h3>
<pre><code class="language-js">ma.connectSocket({
  <span class="hljs-attr">url</span>: <span class="hljs-string">&#x27;wss://example.com&#x27;</span>
});
ma.onSocketMessage(<span class="hljs-function">(<span class="hljs-params">res</span>) =&gt;</span> {
  <span class="hljs-built_in">console</span>.<span class="hljs-built_in">log</span>(res.data);
});
</code></pre>
