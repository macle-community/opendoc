<h2 id="maonmemorywarningfunction-callback">ma.onMemoryWarning(function callback)</h2>
<blockquote>
<p>监听内存不足告警事件。</p>
</blockquote>
<p>当 iOS/Android 向小程序进程发出内存警告时，触发该事件。触发该事件不意味小程序被杀，大部分情况下仅仅是告警，开发者可在收到通知后回收一些不必要资源避免进一步加剧内存紧张。</p>
<h3 id="参数">参数</h3>
<h4 id="function-callback">function callback</h4>
<p>内存不足告警事件的回调函数</p>
<h3 id="示例代码">示例代码</h3>
<pre><code class="language-js">ma.onMemoryWarning(<span class="hljs-keyword">function</span> (<span class="hljs-params">res</span>) {
  <span class="hljs-built_in">console</span>.<span class="hljs-built_in">log</span>(<span class="hljs-string">&#x27;内存不足!&#x27;</span>);
})
</code></pre>
