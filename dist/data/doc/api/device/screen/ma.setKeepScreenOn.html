<h2 id="masetkeepscreenonobject-object">ma.setKeepScreenOn(Object object)</h2>
<blockquote>
<p>设置是否保持常亮状态。仅在当前小程序生效，离开小程序后设置失效。</p>
</blockquote>

</tr>
