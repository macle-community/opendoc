<h2 id="maoffbluetoothdevicefoundfunction-listener">ma.offBluetoothDeviceFound(function listener)</h2>
<blockquote>
<p>移除搜索到新设备的事件的全局监听函数（最低版本：24.6.0）</p>
</blockquote>
<h3 id="参数">参数</h3>
<h4 id="function-listener">function listener</h4>
<p>指定要移除的监听函数，若不指定则移除已注册的所有监听函数</p>
<h3 id="示例代码">示例代码</h3>
<pre><code class="language-js"><span class="hljs-keyword">function</span> <span class="hljs-title">clearListener</span>() {
  ma.offBluetoothDeviceFound();
}
</code></pre>
