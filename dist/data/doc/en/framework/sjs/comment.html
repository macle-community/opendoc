<h2 id="comments">Comments</h2>
<p>The comment method is the same as that in JavaScript. You can use the following method to comment out the SJS code:</p>
<pre><code class="language-js"><span class="hljs-comment">// page.sjs</span>
<span class="hljs-comment">// Method 1: Single-line comment</span>
<span class="hljs-comment">/*
  Method 2: Multi-line comment
  The content in the middle is commented out.
*/</span>
<span class="hljs-keyword">let</span> h = <span class="hljs-string">&#x27;hello&#x27;</span>;
<span class="hljs-keyword">const</span> w = <span class="hljs-string">&#x27; macle&#x27;</span>;
</code></pre>
