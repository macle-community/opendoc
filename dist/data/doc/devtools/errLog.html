<h1 id="问题定位">问题定位</h1>
<blockquote>
<p>Macle 支持用户在开发工具使用过程中打印异常日志，帮助开发者更高效、准确地定位异常问题（最低版本： 23.9.0）</p>
</blockquote>
<h3 id="功能入口">功能入口</h3>
<p><img src="/openplatform/macledocs/data/doc/devtools/image/log/log_Loc.png" alt="image" ></p>
<h3 id="日志查看">日志查看</h3>
<p>在日志功能通过开发工具的拓展配置项界面开启日志打印功能后，工具运行时若发生异常错误，会在以下路径生成错误日志</p>
<p><code>User/用户名/.macle/log/log.txt</code></p>
