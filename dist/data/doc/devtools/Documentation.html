<h2 id="查看开发文档">查看开发文档</h2>
<blockquote>
<p>macle开放文档的快速入口（最低版本: 23.3.0）</p>
</blockquote>
<p>为了方便开发者快速查看开放文档，macle在工具中集成了开发文档。开发者可以通过插件的功能界面快速打开开发文档。</p>
<h2 id="功能界面">功能界面</h2>
<p><img src="/openplatform/macledocs/data/doc/devtools/image/documentation/documentation_GUI.png" alt="image" ></p>
<h2 id="修改打开方式">修改打开方式</h2>
<p>当前支持两种打开方式：</p>
<ul>
<li>Open in VS Code ： 直接在vscode编辑器中打开 （默认）</li>
<li>Open in Chrome ： 新建一个浏览器窗口并跳转到开放文档页面</li>
</ul>
<p>开发者可以通过拓展配置页面修改文档的打开方式,详情请参考<a onclick="_mdLinkClick(this.href)" href="#/guide/config">配置小程序</a></p>
