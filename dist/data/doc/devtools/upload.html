<h1 id="打包">打包</h1>
<h2 id="简介">简介</h2>
<p>在小程序完成开发之后，项目代码需要打包上传至开放平台，然后才能上线。</p>
<h2 id="打包方法">打包方法</h2>
<ol>
<li>在侧边栏工具目录中，点击 <strong>编译打包</strong> 菜单。</li>
<li>打包成功后，在右下角信息也可以打开文件目录</li>
<li>打包路径下默认只保留最新的编译包</li>
</ol>
