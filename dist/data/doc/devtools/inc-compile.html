<h1 id="增量编译">增量编译</h1>
<p>为了提升大型小程序项目的开发体验，减少编译等待时间，在<strong>开发态分包模式</strong>下，将会启用增量编译，即只编译修改资源相关联的包，以提升编译速度，原则如下：</p>
<ul>
<li>如果修改子包里的资源，则只编译该子包</li>
<li>如果修改主包里的非样式（.mass）或 app.json 或 project.config.json 资源，则只编译主包</li>
<li>其他场景，则全量编译</li>
</ul>
<blockquote>
<p>注意：<strong>增量编译仅在开发态分包模式下生效</strong></p>
</blockquote>
