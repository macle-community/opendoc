<h1 id="导出离线包">导出离线包</h1>
<blockquote>
<p>小程序包导出工具，自定义导出路径（最低版本23.3.0）</p>
</blockquote>
<h2 id="介绍">介绍</h2>
<p>macle开发插件集成了导出离线包功能，区别于<a onclick="_mdLinkClick(this.href)" href="#/devtools/upload">编译打包</a>功能，导出离线包支持开发者自定义导出包路径</p>
<h2 id="使用方法">使用方法</h2>
<p><img src="/openplatform/macledocs/data/doc/devtools/image/upload/exportPackage.png" alt="image" ></p>
<p>①：点击打开导出离线包主界面</p>
<p>②：点击选择导出包路径</p>
<p>③：点击执行导出操作</p>
