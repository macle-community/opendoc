<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <link rel="icon" href="/openplatform/macledocs/favicon.ico"/>
  <title>Macle Open Document</title>

  <!-- Prevent Theme Flashing (FOUT) -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('macle_docs_theme_pref');
        let theme = 'light';
        if (saved === 'dark') {
          theme = 'dark';
        } else if (saved === 'light') {
          theme = 'light';
        } else {
          // system default
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <!-- Google Fonts: Inter / JetBrains Mono (with system fallback) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Core Modern Documentation Stylesheet -->
  <link href="/openplatform/macledocs/css/modern-docs.css" rel="stylesheet">
  <!-- Code Block Runner & Web Simulator Stylesheet -->
  <link href="/openplatform/macledocs/css/doc-runner.css" rel="stylesheet">

  <!-- Core Scripts -->
  <script defer src="/openplatform/macledocs/js/modern-app.js"></script>
  <script defer src="/openplatform/macledocs/js/doc-runner.js"></script>
</head>
<body>
  <noscript>
    <div style="padding: 24px; text-align: center; font-family: sans-serif;">
      <strong>We're sorry but Macle OpenDoc requires JavaScript enabled. Please enable it to continue.</strong>
    </div>
  </noscript>
  <div id="app"></div>
</body>
</html>
